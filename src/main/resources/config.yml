# Aethos Crops configuration
#
# You can define any amount of crops under the 'crops' section.
# Each crop id becomes its unique key in the CropRegistry.

# Genetik: Jeder Samen traegt drei Gen-Werte (growth/yield/resistance, je 0-255;
# Default 0 = Vanilla-Verhalten, hoehere Werte wirken nur verbessernd:
# Wachstum x1.0-2.0, Drop-Menge x1.0-2.0, Krankheits-Chance x1.0-0.5).
# Angezeigt wird nur die Sterne-Guete (1-5) als Durchschnitt; Samen gleicher
# Guete stacken. WHEAT_SEEDS-Eintraege in Drop-Tabellen werden als vererbte
# Samen der Elternpflanze gedroppt (Gene +/- mutation-spread).
genetics:
  mutation-spread: 12
  # Gen-Wirkung (Defaults; pro Crop unter crops.<id>.genetics ueberschreibbar):
  # Gen-Wert 255 ergibt Multiplikator 1.0 + max-bonus (Wachstum/Ertrag) bzw.
  # Krankheits-Chance-Faktor 1.0 - max-reduction (Resistenz).
  growth-max-bonus: 1.0
  yield-max-bonus: 1.0
  resistance-max-reduction: 0.5

# Modelle: 'item-model' ist das Item-Model des Pflanzen-Displays im Resource
# Pack (Default: "aethos:block/crops/<crop-id>"). Das Wachstums-Stadium waehlt
# der Client per custom_model_data-Float 0..7 (range_dispatch); die Aethos-Stufe
# (1..max-stage) wird dafuer linear auf 0..7 skaliert.
# Ernte-Regeln
harvest:
  # Eine ausgewachsene Pflanze wirft immer mindestens einen vererbten Samen ab,
  # auch wenn alle Drop-Wuerfe fehlschlagen oder die Tabelle keinen Samen enthaelt.
  guaranteed-seed: true

# Schutz-Regeln
protection:
  # true: Trampeln prallt an Aethos-Pflanzen ab (Pflanze + Farmland bleiben).
  # false: bisheriges Verhalten - Pflanze wird zerstoert und droppt ihre Beute.
  cancel-trample: true

# Krankheits-Progression (Defaults; pro Crop unter crops.<id>.diseases ueberschreibbar)
diseases:
  # Gesundheitsverlust in % pro Wachstums-Tick und Krankheits-Level
  damage-per-level: 5.0
  max-level: 5

crops:
  wheat:
    display-name: "Weizen"
    item-model: "aethos:block/crops/wheat"

    # It is recommended to leave this at 1.0 and instead define the time it takes
    # for a plant to grow by adding/removing growth-stages, this makes the
    # overall appearance and behaviour of the plant more realistic
    grow-speed: 1.0
    max-stage: 7
    allowed-diseases:
      weed: 0.3
    drops:
      entries:
        wheat_item1:
          material: WHEAT
          amount: 1
          chance: 1.0
