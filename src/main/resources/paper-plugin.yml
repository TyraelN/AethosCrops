name: AethosCrops
version: 1.0.0-SNAPSHOT
main: de.aethos.crops.AethosCrops
api-version: '26.1'
description: Custom-Crops mit Wachstumsstufen, Krankheiten und Drops (Item-Display-Modelle).
authors: [Aethos]
website: https://github.com/TyraelN/AethosCrops
# Befehl /aethoscrops (Alias /acrops) wird im Code via Brigadier-Lifecycle registriert.
# GuiLib: GUI-Standard der Aethos-Plugins (Item-Menues), siehe AETHOS.md.
dependencies:
  server:
    GuiLib:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  aethoscrops.admin:
    description: Zugriff auf die AethosCrops-Verwaltungsbefehle.
    default: op
  aethoscrops.analyze:
    description: Erlaubt das Samen-Analyse-Menü (/aethoscrops analyze).
    default: op
